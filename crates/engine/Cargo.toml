[package]
name = "vdoc-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VDoc engine: session, selection, undo, the command registry (every action is a command), Word's command catalog, file I/O dispatch"

[lints]
workspace = true

[dependencies]
vdoc-geom = { workspace = true }
vdoc-doc = { workspace = true }
vdoc-fonts = { workspace = true }
vdoc-layout = { workspace = true }
vdoc-render = { workspace = true }
vdoc-proof = { workspace = true }
vdoc-docx = { workspace = true }
vdoc-docbin = { workspace = true }
vdoc-pdf = { workspace = true }
vdoc-formats = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
regex-automata = { workspace = true }
image = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser clock for `now_iso` (`SystemTime::now()` panics on wasm32).
js-sys = "0.3"

[dev-dependencies]
zip = { workspace = true }
