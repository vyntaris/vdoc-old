[package]
name = "vdoc-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VDoc rasteriser: pages and thumbnails from the layout display list (vello_cpu), PNG/JPEG export"

[lints]
workspace = true

[dependencies]
vdoc-geom = { workspace = true, features = ["image"] }
vdoc-doc = { workspace = true }
vdoc-fonts = { workspace = true }
vdoc-layout = { workspace = true }
vdoc-metafile = { workspace = true }
vello_cpu = { workspace = true }
image = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
