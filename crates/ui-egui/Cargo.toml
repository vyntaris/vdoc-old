[package]
name = "vdoc-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VDoc egui front end (Word-style ribbon UI); swappable: nothing below depends on it"

[lints]
workspace = true

[dependencies]
vdoc-geom = { workspace = true }
vdoc-doc = { workspace = true }
vdoc-fonts = { workspace = true }
vdoc-layout = { workspace = true }
vdoc-render = { workspace = true }
vdoc-engine = { workspace = true }
vdoc-zotero = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# Pictures pasted from the system clipboard arrive as pixels and are inserted as PNG (#45).
image = { workspace = true }
# The system's preferred interface languages (#8). Native: OS APIs; wasm: none (English).
sys-locale = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser clock (`SystemTime::now()`/`Instant::now()` panic on wasm32).
js-sys = "0.3"

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
zip = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
