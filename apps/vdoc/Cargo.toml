[package]
name = "vdoc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "vdoc"
description = "VDoc desktop app"

[lints]
workspace = true

[dependencies]
vdoc-doc = { workspace = true }
vdoc-engine = { workspace = true }
vdoc-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "links"] }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { workspace = true }
